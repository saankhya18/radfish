<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>radFS · Adaptive Radix Tree</title>
<style>
:root{
  --bg:#0d0e11; --surface:#14161b;
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.16);
  --text:#ecebe6; --text2:#a0a3ad; --text3:#62666f;
  --accent:#7c98ec;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

#id{position:fixed;left:24px;top:20px;display:flex;align-items:baseline;gap:9px;pointer-events:none}
#id b{font-weight:600;font-size:14px;letter-spacing:-.005em}
#id span{color:var(--text3);font-size:12px}

#live-ctl{position:fixed;right:24px;top:18px;display:flex;align-items:center;gap:16px}
#metric{color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums}
#live{display:flex;align-items:center;gap:8px;padding:4px 2px;color:var(--text3);font-size:12.5px;transition:color .25s}
#live i{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s}
#live.on{color:var(--text)}
#live.on i{background:var(--accent)}

/* tiny optional input */
#addbar{position:fixed;top:13px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;opacity:.55;transition:opacity .25s}
#addbar:hover,#addbar:focus-within{opacity:1}
#addin{width:min(250px,30vw);background:none;border:0;border-bottom:1px solid var(--line2);outline:none;padding:6px 2px;font:12px var(--mono);color:var(--text);user-select:text;transition:border-color .2s}
#addin:focus{border-color:var(--accent)}
#addin::placeholder{color:var(--text3)}
#addbar button{font-size:12px;padding:6px 9px;color:var(--text3);border-radius:5px;transition:color .2s}
#addbar button:hover{color:var(--text)}

#crumbs{position:fixed;top:58px;left:50%;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap;font-size:12.5px;color:var(--text3)}
#crumbs button{padding:4px 6px;color:var(--text3);border-radius:4px;transition:color .2s}
#crumbs button:hover{color:var(--text)}
#crumbs button.cur{color:var(--text);cursor:default}
#crumbs .sep{color:var(--line2)}

#hints{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:16px;font-size:11.5px;color:var(--text3);white-space:nowrap;transition:opacity 1.2s ease;pointer-events:none}
#hints.off{opacity:0}
#hints kbd{font-family:var(--mono);font-size:10.5px;color:var(--text2);border:1px solid var(--line);border-radius:3px;padding:1px 4px;margin-right:3px}

/* inspector, only on demand */
#inspector{position:fixed;right:20px;top:60px;width:232px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(20,22,27,.96);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
#inspector.open{opacity:1;transform:none;pointer-events:auto}
#inspector header{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-right:18px}
#inspector .tag{font-family:var(--mono);font-size:11px;color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
#inspector .path{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#inspector .x{position:absolute;right:8px;top:7px;color:var(--text3);font-size:16px;line-height:1;padding:2px 6px}
#inspector .x:hover{color:var(--text)}
.rows{display:grid;gap:7px}
.rows div{display:flex;justify-content:space-between;align-items:baseline}
.rows span{color:var(--text3)}
.rows b{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--text);font-variant-numeric:tabular-nums}
#inspector .cap{color:var(--text3);margin:14px 0 7px}
#inspector canvas{display:block;width:100%}
#inspector .keys{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
#inspector .keys u{text-decoration:none;font-family:var(--mono);font-size:10px;min-width:17px;text-align:center;padding:1px 3px;border:1px solid var(--line);color:var(--text2);border-radius:3px}
#inspector .note{color:var(--text3);line-height:1.5;margin-top:12px}
#inspector .note b{color:var(--text2);font-weight:500;font-family:var(--mono);font-size:11px}

@media (max-width:760px){
  #hints,#metric{display:none}
  #inspector{right:10px;left:10px;width:auto;top:auto;bottom:14px}
}

</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="Adaptive Radix Tree"></canvas>

<header id="id"><b>radFS</b><span>Adaptive Radix Tree</span></header>

<form id="addbar" autocomplete="off">
  <input id="addin" placeholder="/src/fs/mount.go" spellcheck="false" aria-label="Path">
  <button type="submit" id="addbtn">Add</button>
  <button type="button" id="findbtn">Find</button>
</form>

<div id="live-ctl">
  <span id="metric"></span>
  <button id="live" class="on" aria-pressed="true" title="Pause or resume activity (Space)"><i></i><span>Live</span></button>
</div>

<nav id="crumbs" aria-label="Focus"></nav>
<aside id="inspector" aria-live="polite"></aside>
<div id="hints"><span><kbd>Space</kbd> pause</span><span><kbd>F</kbd> fit</span><span><kbd>Esc</kbd> back</span><span><kbd>R</kbd> lookups</span><span><kbd>D</kbd> demo</span><span>double-click a folder to enter</span></div>

<script>
/* ==========================================================================
   radFS · ADAPTIVE RADIX TREE MODEL
   --------------------------------------------------------------------------
   A real ART (Leis, Kemper, Neumann — "The Adaptive Radix Tree").
     · Node4 / Node16 / Node48 / Node256 with real child-lookup semantics
     · path compression (pessimistic: full prefix stored in the node)
     · lazy expansion (a leaf stores its whole key; no chain of single-child nodes)
     · grow on full, shrink with libart's hysteresis thresholds (256→48 @37,
       48→16 @12, 16→4 @3), collapse of 1-child Node4 with prefix merge
   Keys are filesystem paths as UTF-8 bytes + a 0x00 terminator, so no key is
   ever a prefix of another ("/src" and "/src/kernel" coexist).

   The visualisation reads this structure and subscribes to its events.
   It never maintains a parallel "fake" tree.
   ========================================================================== */
const RADFS = (() => {
  'use strict';

  let UID = 0;
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  // memory model from the ART paper: header(16) + keys + child pointers
  const NODE_BYTES = { 4: 52, 16: 160, 48: 656, 256: 2064 };
  const GROW_TO    = { 4: 16, 16: 48, 48: 256 };
  const SHRINK_TO  = { 256: 48, 48: 16, 16: 4 };
  const SHRINK_AT  = { 256: 37, 48: 12, 16: 3 };

  function keyOf(path) {
    const b = enc.encode(path);
    const k = new Uint8Array(b.length + 1);
    k.set(b);
    k[b.length] = 0;
    return k;
  }
  function keyStr(k) { return dec.decode(k.subarray(0, k.length - 1)); }
  function eqKey(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function byteChar(b) {
    if (b === 0) return '$';
    if (b >= 32 && b < 127) return String.fromCharCode(b);
    return '·';
  }
  function bytesStr(arr) {
    let s = '';
    for (const b of arr) s += byteChar(b);
    return s;
  }

  class Leaf {
    constructor(key, val) {
      this.kind = 'leaf';
      this.uid = ++UID;
      this.key = key;
      this.val = val;
    }
    get path() { return keyStr(this.key); }
  }

  class Inner {
    constructor(type, uid) {
      this.kind = 'inner';
      this.type = type;
      this.uid = uid || ++UID;
      this.prefix = [];
      this.n = 0;
      if (type === 4 || type === 16) { this.keys = []; this.kids = []; }
      else if (type === 48) { this.index = new Uint8Array(256); this.slots = new Array(48).fill(null); }
      else { this.slots = new Array(256).fill(null); }
    }
    find(b) {
      switch (this.type) {
        case 4: case 16: {
          const i = this.keys.indexOf(b);
          return i < 0 ? null : this.kids[i];
        }
        case 48: { const s = this.index[b]; return s ? this.slots[s - 1] : null; }
        default: return this.slots[b] || null;
      }
    }
    add(b, child) {
      switch (this.type) {
        case 4: case 16: {
          let i = 0;
          while (i < this.keys.length && this.keys[i] < b) i++;
          this.keys.splice(i, 0, b);
          this.kids.splice(i, 0, child);
          break;
        }
        case 48: {
          let s = 0;
          while (this.slots[s] !== null) s++;
          this.slots[s] = child;
          this.index[b] = s + 1;
          break;
        }
        default: this.slots[b] = child;
      }
      this.n++;
    }
    replace(b, child) {
      switch (this.type) {
        case 4: case 16: this.kids[this.keys.indexOf(b)] = child; break;
        case 48: this.slots[this.index[b] - 1] = child; break;
        default: this.slots[b] = child;
      }
    }
    remove(b) {
      switch (this.type) {
        case 4: case 16: {
          const i = this.keys.indexOf(b);
          this.keys.splice(i, 1);
          this.kids.splice(i, 1);
          break;
        }
        case 48: { const s = this.index[b] - 1; this.slots[s] = null; this.index[b] = 0; break; }
        default: this.slots[b] = null;
      }
      this.n--;
    }
    /** children sorted by key byte, with the physical slot each one occupies */
    entries() {
      const out = [];
      switch (this.type) {
        case 4: case 16:
          for (let i = 0; i < this.keys.length; i++) out.push({ b: this.keys[i], child: this.kids[i], slot: i });
          break;
        case 48:
          for (let b = 0; b < 256; b++) if (this.index[b]) out.push({ b, child: this.slots[this.index[b] - 1], slot: this.index[b] - 1 });
          break;
        default:
          for (let b = 0; b < 256; b++) if (this.slots[b]) out.push({ b, child: this.slots[b], slot: b });
      }
      return out;
    }
    get capacity() { return this.type; }
  }

  function convert(node, to) {
    const nn = new Inner(to, node.uid);      // identity (uid) survives the transformation
    nn.prefix = node.prefix;
    for (const e of node.entries()) nn.add(e.b, e.child);
    return nn;
  }

  class ART {
    constructor() {
      this.root = null;
      this.lookups = 0;
      this.listeners = [];
    }
    on(fn) { this.listeners.push(fn); }
    emit(type, d) { for (const l of this.listeners) l(type, d || {}); }

    /* ----------------------------------------------------------------- insert */
    insert(key, val) {
      this._trail = [];
      this.root = this._ins(this.root, key, 0, val, null);
      this.emit('trail', { kind: 'insert', path: this._trail, key: keyStr(key) });
      this._trail = null;
    }
    _ins(node, key, depth, val, parentUid) {
      if (node === null) {
        const l = new Leaf(key, val);
        this.emit('leaf+', { leaf: l.uid, parent: parentUid, key: keyStr(key) });
        return l;
      }
      this._trail.push(node.uid);
      if (node.kind === 'leaf') {
        if (eqKey(node.key, key)) { node.val = val; this.emit('update', { leaf: node.uid }); return node; }
        // lazy expansion: both keys share a prefix below `depth` -> new Node4 holding the common part
        let i = depth;
        const max = Math.min(node.key.length, key.length);
        while (i < max && node.key[i] === key[i]) i++;
        const l2 = new Leaf(key, val);
        const n = new Inner(4);
        n.prefix = Array.from(key.subarray(depth, i));
        n.add(node.key[i], node);
        n.add(key[i], l2);
        this.emit('split', { inner: n.uid, below: node.uid, leaf: l2.uid, parent: parentUid });
        return n;
      }
      const pl = node.prefix.length;
      if (pl) {
        let p = 0;
        while (p < pl && depth + p < key.length && node.prefix[p] === key[depth + p]) p++;
        if (p < pl) {
          // key diverges inside the compressed prefix -> split the prefix
          const n = new Inner(4);
          n.prefix = node.prefix.slice(0, p);
          const nb = node.prefix[p];
          node.prefix = node.prefix.slice(p + 1);
          this.emit('prefix', { uid: node.uid });
          const l2 = new Leaf(key, val);
          n.add(nb, node);
          n.add(key[depth + p], l2);
          this.emit('split', { inner: n.uid, below: node.uid, leaf: l2.uid, parent: parentUid });
          return n;
        }
        depth += pl;
      }
      const b = key[depth];
      const c = node.find(b);
      if (c) {
        const nc = this._ins(c, key, depth + 1, val, node.uid);
        if (nc !== c) node.replace(b, nc);
        return node;
      }
      const l = new Leaf(key, val);
      let target = node;
      if (node.n === node.capacity) {
        const from = node.type, to = GROW_TO[from];
        const oldSlots = node.entries().map(e => ({ uid: e.child.uid, idx: e.slot }));
        target = convert(node, to);
        this.emit('grow', { uid: node.uid, from, to, count: node.n, oldSlots });
      }
      target.add(b, l);
      this.emit('leaf+', { leaf: l.uid, parent: node.uid, key: keyStr(key) });
      return target;
    }

    /* ----------------------------------------------------------------- remove */
    remove(key) {
      this._trail = [];
      const r = this._del(this.root, key, 0, null);
      const trail = this._trail;
      this._trail = null;
      if (!r.removed) return null;
      this.root = r.node;
      this.emit('trail', { kind: 'remove', path: trail, key: keyStr(key) });
      return r.removed;
    }
    _del(node, key, depth, parentUid) {
      if (!node) return { node: null, removed: null };
      this._trail.push(node.uid);
      if (node.kind === 'leaf') {
        if (eqKey(node.key, key)) {
          this.emit('leaf-', { leaf: node.uid, parent: parentUid, key: keyStr(key) });
          return { node: null, removed: node };
        }
        return { node, removed: null };
      }
      const pl = node.prefix.length;
      if (pl) {
        for (let p = 0; p < pl; p++) if (node.prefix[p] !== key[depth + p]) return { node, removed: null };
        depth += pl;
      }
      const b = key[depth];
      const c = node.find(b);
      if (!c) return { node, removed: null };
      const r = this._del(c, key, depth + 1, node.uid);
      if (!r.removed) return { node, removed: null };
      if (r.node === c) return { node, removed: r.removed };
      if (r.node === null) return { node: this._removeChild(node, b), removed: r.removed };
      node.replace(b, r.node);
      return { node, removed: r.removed };
    }
    _removeChild(node, b) {
      node.remove(b);
      const t = node.type;
      if (t !== 4 && node.n <= SHRINK_AT[t]) {
        const to = SHRINK_TO[t];
        const oldSlots = node.entries().map(e => ({ uid: e.child.uid, idx: e.slot }));
        const nn = convert(node, to);
        this.emit('shrink', { uid: node.uid, from: t, to, count: node.n, oldSlots });
        return nn;
      }
      if (t === 4 && node.n === 1) {
        // a Node4 with a single child disappears: merge its prefix + edge byte into the child
        const e = node.entries()[0];
        const c = e.child;
        if (c.kind === 'inner') {
          c.prefix = node.prefix.concat([e.b], c.prefix);
          this.emit('prefix', { uid: c.uid });
        }
        this.emit('collapse', { gone: node.uid, into: c.uid, leaf: c.kind === 'leaf' });
        return c;
      }
      return node;
    }

    /* ----------------------------------------------------------------- lookup */
    lookup(path, quiet) {
      const key = keyOf(path);
      let node = this.root, depth = 0;
      const trail = [];
      let found = false, leaf = null;
      while (node) {
        trail.push(node.uid);
        if (node.kind === 'leaf') {
          if (eqKey(node.key, key)) { found = true; leaf = node; }
          break;
        }
        const pl = node.prefix.length;
        let ok = true;
        for (let p = 0; p < pl; p++) if (node.prefix[p] !== key[depth + p]) { ok = false; break; }
        if (!ok) break;
        depth += pl;
        const c = node.find(key[depth]);
        if (!c) break;
        node = c;
        depth++;
      }
      if (!quiet) {
        this.lookups++;
        this.emit('lookup', { path: trail, found, key: path, leaf: leaf ? leaf.uid : null });
      }
      return { found, leaf, trail };
    }

    /** node whose subtree is exactly the set of keys beginning with `pref` (string) */
    nodeForPrefix(pref) {
      const p = enc.encode(pref);
      let node = this.root, depth = 0;
      if (!node) return null;
      if (p.length === 0) return node;
      while (node) {
        if (node.kind === 'leaf') {
          for (let i = 0; i < p.length; i++) if (node.key[i] !== p[i]) return null;
          return node;
        }
        const pl = node.prefix.length;
        const rem = p.length - depth;
        const cmp = Math.min(pl, rem);
        for (let i = 0; i < cmp; i++) if (node.prefix[i] !== p[depth + i]) return null;
        if (rem <= pl) return node;
        depth += pl;
        const c = node.find(p[depth]);
        if (!c) return null;
        depth++;
        node = c;
        if (depth >= p.length) return node;
      }
      return null;
    }
    leavesWithPrefix(pref) {
      const n = this.nodeForPrefix(pref);
      const out = [];
      const walk = (x) => {
        if (!x) return;
        if (x.kind === 'leaf') { out.push(x); return; }
        for (const e of x.entries()) walk(e.child);
      };
      walk(n);
      return out;
    }

    /* ------------------------------------------------------------------ stats */
    stats() {
      const counts = { 4: 0, 16: 0, 48: 0, 256: 0 };
      let leaves = 0, inner = 0, depth = 0, mem = 0;
      const walk = (n, d) => {
        if (!n) return;
        if (d > depth) depth = d;
        if (n.kind === 'leaf') { leaves++; mem += 16 + n.key.length + 8; return; }
        inner++;
        counts[n.type]++;
        mem += NODE_BYTES[n.type] + n.prefix.length;
        for (const e of n.entries()) walk(e.child, d + 1);
      };
      walk(this.root, 1);
      return { nodes: leaves + inner, leaves, inner, counts, depth, memory: mem, lookups: this.lookups };
    }

    /** structural self-check used by the test-suite */
    check() {
      const errs = [];
      const walk = (n, acc) => {
        if (n.kind === 'leaf') {
          const k = Array.from(n.key);
          for (let i = 0; i < acc.length; i++) if (k[i] !== acc[i]) errs.push('leaf key does not extend path ' + keyStr(n.key));
          return 1;
        }
        const es = n.entries();
        if (es.length !== n.n) errs.push('count mismatch uid=' + n.uid);
        if (n.n > n.capacity) errs.push('over capacity');
        if (n.type === 4 && n.n < 2) errs.push('Node4 with <2 children (should have collapsed)');
        if (n.type === 16 && n.n <= SHRINK_AT[16]) errs.push('Node16 should have shrunk, n=' + n.n);
        if (n.type === 48 && n.n <= SHRINK_AT[48]) errs.push('Node48 should have shrunk, n=' + n.n);
        if (n.type === 256 && n.n <= SHRINK_AT[256]) errs.push('Node256 should have shrunk, n=' + n.n);
        if (n.type === 16 && n.n < 5 && false) errs.push('n16 small');
        let c = 0;
        for (let i = 1; i < es.length; i++) if (es[i - 1].b >= es[i].b) errs.push('entries not sorted');
        for (const e of es) c += walk(e.child, acc.concat(n.prefix, [e.b]));
        return c;
      };
      if (this.root) walk(this.root, []);
      return errs;
    }
  }

  /* ========================================================================
     FILESYSTEM LAYER — paths, directories, files on top of the ART
     ======================================================================== */
  function norm(p) {
    p = ('/' + p).replace(/\/+/g, '/');
    if (p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
    return p;
  }
  function parentOf(p) { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); }
  function baseName(p) { return p.slice(p.lastIndexOf('/') + 1); }

  class FS {
    constructor() { this.art = new ART(); }
    reset() { const l = this.art.listeners; this.art = new ART(); this.art.listeners = l; }
    get(p) { const r = this.art.lookup(norm(p), true); return r.found ? r.leaf : null; }
    isDir(p) { p = norm(p); if (p === '/') return true; const l = this.get(p); return !!(l && l.val.dir); }
    exists(p) { p = norm(p); return p === '/' || !!this.get(p); }
    mkdir(p) {
      p = norm(p);
      if (p === '/' || this.exists(p) || !this.isDir(parentOf(p))) return false;
      this.art.insert(keyOf(p), { dir: true, size: 0 });
      return true;
    }
    create(p, size) {
      p = norm(p);
      if (p === '/' || this.exists(p) || !this.isDir(parentOf(p))) return false;
      this.art.insert(keyOf(p), { dir: false, size: size == null ? 120 + ((p.length * 977) % 7000) : size });
      return true;
    }
    /** every entry at or below p, deepest/last first */
    subtree(p) {
      p = norm(p);
      return this.art.leavesWithPrefix(p)
        .filter(l => l.path === p || l.path.startsWith(p + '/'))
        .map(l => l.path)
        .sort().reverse();
    }
    rm(p) {
      p = norm(p);
      if (p === '/' || !this.exists(p)) return 0;
      const list = this.isDir(p) ? this.subtree(p) : [p];
      for (const q of list) this.art.remove(keyOf(q));
      return list.length;
    }
    rename(a, b) {

        : `<div class="note">With a single entry this folder has no node of its own. The tree stores that entry directly (lazy expansion) until a second one arrives.</div>`;
    }
    insp.innerHTML = h;
    insp.querySelector('.x').addEventListener('click', () => select(null));
    if (n && v.kind !== 'file') drawInspectorCanvas(n);
  }
  function drawInspectorCanvas(n) {
    const c = $('icv'); if (!c) return;
    const cssW = c.clientWidth || 204;
    const specH = { 4: 40, 16: 58, 48: 98, 256: 68 }[n.type];
    c.style.height = specH + 'px';
    c.width = Math.round(cssW * DPR); c.height = Math.round(specH * DPR);
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const es = n.entries();
    g.font = '11px ' + MONO; g.textAlign = 'center'; g.textBaseline = 'middle';
    const fillOf = (child) => child.kind === 'inner' ? C.text : C.text2;
    if (n.type === 4 || n.type === 16) {
      const cols = n.type === 4 ? 4 : 8, gap = 4;
      const cw = (cssW - gap * (cols - 1)) / cols, ch = n.type === 4 ? 36 : 26;
      for (let i = 0; i < n.type; i++) {
        const x = (i % cols) * (cw + gap), y = ((i / cols) | 0) * (ch + gap), e = es[i];
        if (e) {
          g.fillStyle = rgba(fillOf(e.child), .1); g.fillRect(x, y, cw, ch);
          g.strokeStyle = rgba(fillOf(e.child), .5); g.lineWidth = 1; g.strokeRect(x + .5, y + .5, cw - 1, ch - 1);
          g.fillStyle = rgba(C.text, .95); g.fillText(R.byteChar(e.b), x + cw / 2, y + ch / 2 + .5);
        } else { g.strokeStyle = rgba(C.ink, .12); g.strokeRect(x + .5, y + .5, cw - 1, ch - 1); }
      }
    } else if (n.type === 48) {
      const stripY = 6;
      g.fillStyle = rgba(C.ink, .05); g.fillRect(0, stripY - 5, cssW, 10);
      const cols = 12, gap = 3, cw = (cssW - gap * (cols - 1)) / cols, ch = 12, gy = 38;
      const slotC = (s) => ({ x: (s % cols) * (cw + gap) + cw / 2, y: gy + ((s / cols) | 0) * (ch + gap) + ch / 2 });
      for (let s = 0; s < 48; s++) { const p = slotC(s); g.strokeStyle = rgba(C.ink, .1); g.strokeRect(p.x - cw / 2 + .5, p.y - ch / 2 + .5, cw - 1, ch - 1); }
      for (const e of es) {
        const x = e.b / 255 * (cssW - 2) + 1, p = slotC(e.slot);
        g.strokeStyle = rgba(C.text2, .28); g.lineWidth = 1; g.beginPath(); g.moveTo(x, stripY + 5); g.lineTo(p.x, p.y - ch / 2); g.stroke();
        g.fillStyle = rgba(C.text, .95); g.fillRect(x - .5, stripY - 4, 1.2, 8);
        g.fillStyle = rgba(fillOf(e.child), .12); g.fillRect(p.x - cw / 2, p.y - ch / 2, cw, ch);
        g.strokeStyle = rgba(fillOf(e.child), .5); g.strokeRect(p.x - cw / 2 + .5, p.y - ch / 2 + .5, cw - 1, ch - 1);
        g.fillStyle = rgba(C.text, .95); g.font = '9px ' + MONO; g.fillText(R.byteChar(e.b), p.x, p.y + .5);
      }
    } else {
      const cols = 32, gap = 1, cw = (cssW - gap * (cols - 1)) / cols, ch = 6;
      const occ = new Map(es.map(e => [e.b, e.child]));
      for (let b = 0; b < 256; b++) {
        const x = (b % cols) * (cw + gap), y = (b >> 5) * (ch + gap), c2 = occ.get(b);
        g.fillStyle = c2 ? rgba(fillOf(c2), .9) : rgba(C.ink, .07); g.fillRect(x, y, cw, ch);
      }
      g.font = '9px ' + MONO; g.fillStyle = rgba(C.text3, 1); g.textBaseline = 'alphabetic';
      g.textAlign = 'left'; g.fillText('0x00', 0, 65); g.textAlign = 'center'; g.fillText('0x80', cssW / 2, 65); g.textAlign = 'right'; g.fillText('0xFF', cssW, 65);
    }
  }
  setInterval(() => { if (selId != null) renderInspector(false); }, 350);
  insp.addEventListener('pointerdown', (e) => e.stopPropagation());

  /* ---------------------------------------------------------------- metric */
  const metric = $('metric'); let metricLast = '';
  setInterval(() => {
    const s = fs.art.stats(), txt = `${s.nodes} nodes · depth ${s.depth}`;
    if (txt !== metricLast) { metricLast = txt; metric.textContent = txt; }
  }, 250);

  /* -------------------------------------------- tiny optional input: Add / Find */
  let engineHold = () => { }, engineRelease = () => { };
  const addIn = $('addin');
  const say = (msg) => { addIn.placeholder = msg; addIn.value = ''; setTimeout(() => { addIn.placeholder = '/src/fs/mount.go'; }, 2200); };
  $('addbar').addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = addIn.value.trim(); if (!raw) return;
    const p = R.norm(raw), parts = p.split('/').filter(Boolean);
    let acc = '';
    for (let i = 0; i < parts.length - 1; i++) { acc += '/' + parts[i]; fs.mkdir(acc); }
    const ok = raw.endsWith('/') ? fs.mkdir(p) : fs.create(p);
    if (ok) addIn.value = ''; else say('already there');
  });
  $('findbtn').addEventListener('click', () => {
    const raw = addIn.value.trim(); if (!raw) { addIn.focus(); return; }
    const steps = fs.steps(raw);
    steps.forEach((s, i) => setTimeout(() => { API.pulseStrength = i === steps.length - 1 ? 1 : .45; fs.lookup(s); API.pulseStrength = 1; }, i * 130));
  });
  addIn.addEventListener('focus', () => engineHold());
  addIn.addEventListener('blur', () => engineRelease());
  addIn.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Escape') addIn.blur(); });

  /* ---------------------------------------------------------------- keyboard */
  const hints = $('hints');
  setTimeout(() => hints.classList.add('off'), 9000);
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key;
    if (key === ' ' || key === 'Spacebar') { e.preventDefault(); API.onToggleLive && API.onToggleLive(); }
    else if (key === 'r' || key === 'R') API.onBurst && API.onBurst();
    else if (key === 'f' || key === 'F') { camMode = 'all'; focusPath = null; focusHist = []; override = null; updateFocus(); computeSets(); renderCrumbs(); }
    else if (key === 'd' || key === 'D') API.onDemo && API.onDemo();
    else if (key === 'h' || key === 'H' || key === '?') hints.classList.toggle('off');
    else if (key === 'Escape') { if (API.demoRunning && API.demoRunning()) API.onStopDemo && API.onStopDemo(); else back(); }
  });

  /* -------------------------------------------------------------------- loop */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt, now); render(now);
    requestAnimationFrame(frame);
  }
  function hardReset() {
    S.clear(); pulses = []; evq = []; selId = null; hoverId = null; drag = null; uidToId.clear();
    focusPath = null; focusHist = []; override = null; camMode = 'fit';
    introPending = true; dirty = true;
    renderInspector(true); renderCrumbs();
  }
  function cinemaPath(path, holdMs) {
    if (API.autoCam !== 'demo') return;
    override = { id: 'd:' + path, until: performance.now() + holdMs, kmax: 1.3 };
  }
  function cinemaWide() { override = null; }

  renderCrumbs();
  requestAnimationFrame((t) => { last = t; frame(t); });

  Object.assign(API, {
    fs, hardReset, fitAll, setFocus, cinemaPath, cinemaWide, select,
    holdHooks(h, r) { engineHold = h; engineRelease = r; },
  });
  Object.defineProperties(API, {
    focusPath: { get: () => focusPath },
    camMode: { get: () => camMode },
  });
  API.debug = { S, hitTest, toScreen };
  Object.defineProperties(API.debug, {
    L: { get: () => L }, cam: { get: () => cam }, pulses: { get: () => pulses },
    hoverId: { get: () => hoverId }, selId: { get: () => selId }, drag: { get: () => drag },
  });
  return API;
})();

</script>
<script>
/* ==========================================================================
   radFS · SYSTEM ACTIVITY + DEMO
   Everything here drives the *real* filesystem (VIZ.fs -> ART). The visuals
   react to the tree's own events, so a lookup pulse is always the real lookup
   path and N4→N16 only happens when a Node4 really overflows.
   ========================================================================== */
(() => {
  'use strict';
  const R = RADFS;
  const fs = VIZ.fs;
  const TS = parseFloat(new URLSearchParams(location.search).get('ts') || '1') || 1;   // test-only time scale

  const state = { live: true, speed: 1, hold: 0, demo: false, epoch: 0 };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  class Cancel extends Error { }
  const CANCEL = new Cancel('cancel');

  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry(0x5eed17);


  /* ------------------------------------------------------------------ timing */
  const liveT = {
    async w(ms) {
      const ep = state.epoch;
      let left = ms * TS;
      while (left > 0) {
        await sleep(40);
        if (ep !== state.epoch) throw CANCEL;
        if (state.live && !state.hold && !state.demo && !document.hidden) left -= 40;
      }
    },
  };
  const instantT = { w: (ms) => sleep(ms * TS) };

  /* --------------------------------------------------------------- primitives */
  const POP = [
    ['/src', 3], ['/src/kernel/main.go', 5], ['/src/drivers/disk.go', 4], ['/docs/design.md', 4], ['/README.md', 2],
  ];
  function pickPopular(last) {
    const avail = POP.filter(([p]) => fs.exists(p) && p !== last);
    if (!avail.length) return null;
    let tot = 0; for (const [, w] of avail) tot += w;
    let r = rng() * tot;
    for (const [p, w] of avail) { r -= w; if (r <= 0) return p; }
    return avail[0][0];
  }
  /** resolve a path the way a VFS does: one real ART lookup per component */
  async function walk(T, path) {
    const steps = fs.steps(path);
    for (let i = 0; i < steps.length; i++) {
      VIZ.pulseStrength = i === steps.length - 1 ? 1 : .42;
      const r = fs.lookup(steps[i]);
      if (i < steps.length - 1) await T.w(75);
      if (!r.found) break;
    }
    VIZ.pulseStrength = 1;
  }

  /* ------------------------------------------------------------ live scenes */
  let lastPick = null;
  async function browse(T, n) {
    for (let i = 0; i < n; i++) {
      const p = pickPopular(lastPick); if (!p) return;
      lastPick = p;
      await walk(T, p);
      await T.w(2200 + rng() * 2200);
    }
  }
  async function tempFile(T) {
    const p = '/src/kernel/tmp.swp';
    if (fs.exists(p)) return;
    fs.create(p); await T.w(2600);
    await walk(T, p); await T.w(2400);
    fs.rm(p); await T.w(2200);
  }
  async function renameCycle(T) {
    const a = '/docs/design.md', b = '/docs/spec.md';
    if (!fs.exists(a)) return;
    await walk(T, a); await T.w(1200);
    fs.rename(a, b); await T.w(3000);
    await walk(T, b); await T.w(3200);
    fs.rename(b, a); await T.w(2800);
  }
  // the adaptation moment: /src/drivers outgrows Node4, then shrinks again
  async function expandCycle(T) {
    const d = '/src/drivers', names = ['net.go', 'tty.go', 'usb.go', 'pci.go'];
    if (!fs.isDir(d)) return;
    for (const nm of names) { fs.create(d + '/' + nm); await T.w(nm === 'pci.go' ? 4800 : 1800); }
    await walk(T, d + '/pci.go'); await T.w(3600);
    for (const nm of names.slice().reverse()) { fs.rm(d + '/' + nm); await T.w(nm === 'tty.go' ? 4200 : 1800); }
    await T.w(2000);
  }
  const scenes = [
    (T) => browse(T, 3),
    (T) => tempFile(T),
    (T) => browse(T, 2),
    (T) => renameCycle(T),
    (T) => browse(T, 3),
    (T) => expandCycle(T),
    (T) => browse(T, 3),
  ];
  async function liveLoop() {
    await sleep(2600);
    let i = 0;
    for (;;) {
      try {
        const sc = scenes[i % scenes.length]; i++;
        await sc(liveT);
        await liveT.w(1200 + rng() * 1200);
      } catch (e) {
        if (e !== CANCEL) { console.error(e); await sleep(1000); continue; }
        while (state.demo) await sleep(200);
        await sleep(2200); i = 0;
      }
    }
  }

  /* ------------------------------------------------------------------- burst */
  let bursting = false;
  async function burst() {
    if (bursting || state.demo) return;
    bursting = true;
    try {
      let l = null;
      for (let i = 0; i < 4; i++) { const p = pickPopular(l); l = p; if (p) await walk(instantT, p); await instantT.w(380); }
    } finally { bursting = false; }
  }

  /* -------------------------------------------------------------------- demo */
  let demoTok = 0, demoCounter = 0;
  const KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcefghijklmoqrsvwxyz';   // distinct first bytes: one node, no forks
  const blob = (i) => KEYS[i] + '.dat';

  async function script(w) {
    const cr = (p) => fs.create(p);
    VIZ.cinemaPath('/src/drivers', 60000);
    await w(1800);
    // N4 -> N16
    for (const n of ['net.go', 'tty.go', 'usb.go']) { cr('/src/drivers/' + n); await w(1100); }
    await w(900);
    cr('/src/drivers/pci.go'); await w(4200);
    // N16 -> N48
    VIZ.cinemaPath('/src/drivers', 60000);
    const more = [];
    for (let i = 0; i < 12; i++) more.push(blob(i));
    for (let i = 0; i < more.length; i++) { cr('/src/drivers/' + more[i]); await w(i === more.length - 1 ? 3800 : 330); }
    // N48 -> N256
    const many = [];
    for (let i = 12; i < 50; i++) many.push(blob(i));
    for (let i = 0; i < many.length; i++) { cr('/src/drivers/' + many[i]); await w(i === many.length - 1 ? 3800 : 110); }
    await walk(instantT, '/src/drivers/' + many[7]); await w(1800);
    // shrink back
    for (let i = many.length - 1; i >= 0; i--) { fs.rm('/src/drivers/' + many[i]); await w(i === 0 ? 3600 : 90); }
    for (let i = more.length - 1; i >= 0; i--) { fs.rm('/src/drivers/' + more[i]); await w(i === 0 ? 3600 : 260); }
    for (const n of ['pci.go', 'usb.go', 'tty.go', 'net.go']) { fs.rm('/src/drivers/' + n); await w(n === 'tty.go' ? 3200 : 900); }
    VIZ.cinemaWide();
    await w(1800);
  }
  function restoreSample() { fs.reset(); R.seed(fs); VIZ.hardReset(); }
  async function runDemo() {
    if (state.demo) { stopDemo(); return; }
    state.demo = true; state.epoch++;
    const my = ++demoCounter; demoTok = my;
    VIZ.autoCam = 'demo';
    const w = async (ms) => { let left = ms * TS; while (left > 0) { await sleep(40); if (demoTok !== my) throw CANCEL; left -= 40; } };
    try { await script(w); } catch (e) { if (e !== CANCEL) console.error(e); }
    if (demoTok !== my) return;
    finishDemo();
  }
  function finishDemo() {
    demoTok = ++demoCounter;
    VIZ.autoCam = 'live'; VIZ.cinemaWide();
    restoreSample();
    state.demo = false; state.epoch++;
  }
  function stopDemo() { if (!state.demo) return; demoTok = ++demoCounter; finishDemo(); }

  /* ---------------------------------------------------------------- controls */
  const liveBtn = document.getElementById('live');
  function toggleLive() {
    state.live = !state.live;
    liveBtn.classList.toggle('on', state.live);
    liveBtn.setAttribute('aria-pressed', String(state.live));
    liveBtn.querySelector('span').textContent = state.live ? 'Live' : 'Paused';
  }
  liveBtn.addEventListener('click', toggleLive);
  VIZ.onToggleLive = toggleLive;
  VIZ.onBurst = burst;
  VIZ.onStopDemo = stopDemo;
  VIZ.onDemo = runDemo;
  VIZ.demoRunning = () => state.demo;
  VIZ.holdHooks(() => { state.hold++; }, () => { state.hold = Math.max(0, state.hold - 1); });
  window.radfs = { fs, state, runDemo, stopDemo, toggleLive, burst, VIZ, scenes: () => scenes.length };

  liveLoop();
})();

</script>
